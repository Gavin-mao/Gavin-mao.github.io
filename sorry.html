<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>青青酱，我错了，给大哥跪下了</title>
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<style>
/* Layout: one phone-width column — header, a stage where the kneeling boy lives, controls, then the letter. Single deliberate pastel look. */
:root{
  --bg:#FFE7EF; --bg2:#FFF5F8; --stage:#EDE8FF; --floor:#DCD4FA;
  --ink:#3B2633; --muted:#8C6C7C; --line:#F2C6D5; --paper:#FFFDF9;
  --berry:#E0457A; --berry-d:#B92A5C; --violet:#7466EA; --violet-d:#5446C6; --dark:#3B2633;
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;margin:4px 0 0;color:var(--berry-d);text-wrap:balance}
.sound{border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer;flex:none}
.toggles{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.sound.on{background:var(--berry);border-color:var(--berry);color:#fff}
.sound:focus-visible,button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

.stage{position:relative;height:clamp(320px,54vh,450px);border-radius:28px;overflow:hidden;background:
  radial-gradient(120% 60% at 50% 100%,var(--floor) 0 30%,transparent 31%),var(--stage);border:2px solid #fff;box-shadow:0 10px 30px rgba(185,42,92,.12);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#rig{position:absolute;inset:0;transform-origin:50% 0}
#boy{position:absolute;left:50%;bottom:5%;height:80%;aspect-ratio:240/300;max-width:100%;transform:translateX(-50%);cursor:pointer}
#boyInner{width:100%;height:100%}
.stage[data-pose="hang"] #boy{bottom:16%;height:70%}
#boySvg{width:100%;height:100%;overflow:visible;display:block}
#boySvg .face,#boySvg .legs-kneel,#boySvg .legs-stand,#boySvg .arms-hold,#boySvg .arms-down,#boySvg .rope,#boySvg .tears{display:none}
#boySvg[data-face="sad"] .face-sad,#boySvg[data-face="shy"] .face-shy,#boySvg[data-face="happy"] .face-happy,#boySvg[data-face="hurt"] .face-hurt{display:inline}
#boySvg[data-face="sad"] .tears,#boySvg[data-face="hurt"] .tears{display:inline}
#boySvg[data-pose="kneel"] .legs-kneel,#boySvg[data-pose="kneel"] .arms-hold{display:inline}
#boySvg[data-pose="stand"] .legs-stand,#boySvg[data-pose="stand"] .arms-down{display:inline}
#boySvg[data-pose="hang"] .legs-stand,#boySvg[data-pose="hang"] .arms-down,#boySvg[data-pose="hang"] .rope{display:inline}
#boySvg[data-pose="hang"] .shadow{display:none}
.blush-extra{opacity:0;transition:opacity .3s}
#boySvg[data-face="shy"] .blush-extra,#boySvg[data-face="happy"] .blush-extra{opacity:.85}
.tear{transform-box:fill-box;animation:drip 1.6s ease-in infinite}
.tear.r{animation-delay:.7s}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.breathe{animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(.985)}}
.sign{width:100%;height:100%;box-sizing:border-box;background:#fff;border:2px solid #E9DCE3;border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:13px;line-height:1.3;color:var(--ink);padding:4px;white-space:pre-line;overflow:hidden}

.prop{position:absolute;left:0;top:0;pointer-events:none;opacity:0;z-index:5}
#hand{width:86px}#glove{width:110px}#whip{width:150px;transform-origin:94% 94%}
.bubble{position:absolute;right:5%;top:5%;max-width:46%;background:#fff;color:var(--ink);border-radius:16px;padding:8px 12px;font-family:var(--display);font-size:16px;line-height:1.3;box-shadow:0 4px 14px rgba(59,38,51,.12);z-index:6;transition:opacity .25s,transform .25s}
.bubble::after{content:"";position:absolute;left:14px;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.hide{opacity:0;transform:translateY(6px)}
.fx{position:absolute;font-family:var(--display);font-size:38px;color:#fff;-webkit-text-stroke:2px var(--berry-d);paint-order:stroke;pointer-events:none;z-index:7;transform:translate(-50%,-50%)}
.heart{position:absolute;color:var(--berry);font-size:22px;pointer-events:none;z-index:6}
.counter{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.75);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);z-index:6;font-variant-numeric:tabular-nums}

.done{position:absolute;inset:0;background:rgba(255,231,239,.88);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;z-index:9}
.done h2{font-family:var(--display);font-weight:400;font-size:36px;margin:0;color:var(--berry-d)}
.done p{margin:0;line-height:1.7;max-width:30ch;white-space:pre-line}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.controls{display:flex;flex-direction:column;gap:10px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{border:0;border-radius:999px;padding:13px 10px;font-family:var(--display);font-size:18px;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.forgive{background:var(--berry)}.btn.out{background:var(--violet)}.btn.punish{background:var(--dark)}
.btn.ghost{background:var(--paper);color:var(--muted);box-shadow:none;border:1px solid var(--line);font-size:15px}
.btn.big{font-size:22px;padding:15px}
.btn.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:0}
.action{display:grid;grid-template-columns:1fr auto;gap:10px}

.letter{background:var(--paper);border-radius:18px;padding:18px 18px 16px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(185,42,92,.08);background-image:repeating-linear-gradient(transparent 0 31px,#F7E3EA 31px 32px);background-position:0 46px}
.letter .to{font-family:var(--display);font-size:20px;color:var(--berry-d);margin:0 0 6px}
.letter .text{white-space:pre-line;line-height:32px;margin:0;font-size:15px}
.letter .from{text-align:right;margin:8px 0 0;font-family:var(--display);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.tear,.breathe,.btn.pulse{animation:none}}
</style>
</head>

          <path d="M56 104 C48 50 84 26 120 28 C160 26 194 52 184 104 C180 88 172 78 162 74 L152 90 L141 70 L127 88 L115 66 L103 88 L90 70 L80 90 C70 84 62 92 56 104Z" fill="#2B2530"/>
          <path d="M98 36 L104 12 L116 32 L130 8 L136 32 L156 18 L150 42Z" fill="#2B2530"/>
          <ellipse cx="82" cy="128" rx="11" ry="6" fill="#FF9EB4" opacity=".55"/>
          <ellipse cx="158" cy="128" rx="11" ry="6" fill="#FF9EB4" opacity=".55"/>
          <g class="blush-extra">

            <ellipse cx="158" cy="128" rx="15" ry="8" fill="#FF7E9E" opacity=".55"/>
          </g>
          <g class="face face-sad" stroke-linecap="round">
            <line x1="84" y1="95" x2="104" y2="88" stroke="#2B2530" stroke-width="4"/>
            <line x1="156" y1="95" x2="136" y2="88" stroke="#2B2530" stroke-width="4"/>
            <ellipse cx="95" cy="111" rx="11" ry="13" fill="#2B2530"/>
            <ellipse cx="145" cy="111" rx="11" ry="13" fill="#2B2530"/>
            <circle cx="99" cy="106" r="4.5" fill="#fff"/><circle cx="92" cy="116" r="2" fill="#fff"/>
            <circle cx="149" cy="106" r="4.5" fill="#fff"/><circle cx="142" cy="116" r="2" fill="#fff"/>
            <path d="M108 143 Q114 137 120 141 Q126 137 132 143" fill="none" stroke="#7A3448" stroke-width="3.5"/>
          </g>
          <g class="face face-shy" stroke-linecap="round" fill="none" stroke="#2B2530" stroke-width="4">
            <path d="M85 112 Q95 119 105 112"/>
            <path d="M135 112 Q145 119 155 112"/>
            <path d="M114 140 Q120 145 126 140" stroke="#7A3448" stroke-width="3.5"/>
          </g>
          <g class="face face-happy" stroke-linecap="round">
            <path d="M85 114 Q95 101 105 114" fill="none" stroke="#2B2530" stroke-width="4.5"/>
            <path d="M135 114 Q145 101 155 114" fill="none" stroke="#2B2530" stroke-width="4.5"/>
            <path d="M105 133 Q120 156 135 133Z" fill="#C2405E"/>
            <path d="M112 145 Q120 150 128 145" fill="none" stroke="#FF9EB4" stroke-width="4"/>
          </g>
          <g class="face face-hurt" stroke-linecap="round" fill="none" stroke="#2B2530" stroke-width="4.5">
            <path d="M87 103 L103 111 L87 119"/>
            <path d="M153 103 L137 111 L153 119"/>

          <g class="tears">

          <g class="arms-hold">

            <circle cx="68" cy="196" r="10" fill="#FFD7C2"/>

    <div class="bubble" id="bubble">宝贝……</div>

    <svg class="prop" id="hand" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="26" y="0" width="48" height="16" rx="6" fill="#F4ECF1" stroke="#D8C8D2" stroke-width="2"/>
      <rect x="20" y="42" width="14" height="40" rx="7" fill="#fff" stroke="#D8C8D2" stroke-width="2"/>
      <rect x="36" y="46" width="14" height="44" rx="7" fill="#fff" stroke="#D8C8D2" stroke-width="2"/>
      <rect x="52" y="46" width="14" height="44" rx="7" fill="#fff" stroke="#D8C8D2" stroke-width="2"/>
      <rect x="68" y="42" width="14" height="38" rx="7" fill="#fff" stroke="#D8C8D2" stroke-width="2"/>
      <rect x="16" y="10" width="68" height="50" rx="24" fill="#fff" stroke="#D8C8D2" stroke-width="2"/>
      <path d="M84 30 Q98 36 92 52" fill="none" stroke="#D8C8D2" stroke-width="10" stroke-linecap="round"/>

      <path d="M24 18 C40 2 86 4 94 34 C100 58 80 76 54 74 L30 70 C22 66 20 24 24 18Z" fill="#E8323C"/>
      <path d="M42 62 C38 50 56 44 64 56" fill="none" stroke="#B51F2A" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="62" cy="22" rx="16" ry="7" fill="#fff" opacity=".35"/>

    <svg class="prop" id="whip" viewBox="0 0 160 160" aria-hidden="true">
      <path d="M118 118 C92 82 44 96 24 46 C18 30 22 18 10 6" fill="none" stroke="#8B5A3C" stroke-width="4" stroke-linecap="round"/>
      <line x1="150" y1="150" x2="116" y2="116" stroke="#5E3620" stroke-width="13" stroke-linecap="round"/>
      <line x1="146" y1="146" x2="138" y2="138" stroke="#C9A06A" stroke-width="13"/>

    <div class="done" id="done" hidden>
      <h2>原谅成功</h2>
      <p id="thanksText"></p>
      <div class="row">
        <button class="btn forgive" type="button" id="againBtn">再摸摸</button>
        <button class="btn ghost" type="button" id="homeBtn2">回到开头</button>

  <div class="controls" id="homeControls">
    <p class="hint">他已经跪好了，你想怎么处置他？</p>
    <div class="choices">
      <button class="btn forgive" type="button" data-mode="pat" id="choosePat">原谅Ta</button>
      <button class="btn out" type="button" data-mode="out" id="chooseOut">滚蛋</button>
      <button class="btn punish" type="button" data-mode="punish" id="choosePunish">惩罚Ta</button>
    </div>
  </div>

  <div class="controls" id="actionControls" hidden>
    <p class="hint" id="actionHint"></p>
    <div class="action">
      <button class="btn big" type="button" id="actionBtn"></button>
      <button class="btn ghost" type="button" id="backBtn">换个方式</button>

  <article class="letter" id="letter">
    <p class="to" id="letterTo"></p>
    <p class="text" id="letterText"></p>
    <p class="from" id="letterFrom"></p>
  </article>
</div>

<script>
/* ===== 在这里改你的道歉内容 ===== */
const CONFIG = {
  to: "青青宝贝",
  from: "你的笨蛋老公",
  title: "青青宝贝，我错了",
  sign: "宝贝我错了\n原谅我嘛\n(｡•́︿•̀｡)",
  letter:
`对不起，都是我不好。

说好陪你的，结果我还先挂电话，让你等我30分钟，我真是太可恶了！！！

我没有顾及你的感受，还在你难过再打来电话的时候嘴硬，让你一个人委屈了。冷静下来想了很久，我错了bb .><.

以后有事我会先听你把话说完，不敷衍、不冷战、不讲道理只认准我宝宝青青。

你生气的样子我也喜欢，但我更想看你笑。这个小人随你处置，打几下都行，只要你别不理我。`,
  thanks: "呜呜呜~谢谢宝贝！\n我上周末就买了这周四晚上的机票，明晚见！\n我买了很多东东回来给你，看看能不能把你哄好~",
};
/* =============================== */

const $ = s => document.querySelector(s);
const stage = $('#stage'), rig = $('#rig'), boy = $('#boy'), svg = $('#boySvg'), bubble = $('#bubble');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

$('#title').textContent = CONFIG.title;
$('#signText').textContent = CONFIG.sign;
$('#letterTo').textContent = '给 ' + CONFIG.to + '：';
$('#letterText').textContent = CONFIG.letter;
$('#letterFrom').textContent = '—— ' + CONFIG.from;
$('#thanksText').textContent = CONFIG.thanks;
$('#eyebrow').textContent = CONFIG.from + '的道歉 · 请查收';

const LINES = {
  home: [CONFIG.to + '……我错了', '可以原谅我吗', '我跪好了'],
  pat: ['……真的可以吗', '呜呜你最好了', '再摸一下嘛', '我以后一定乖', '心都化了'],
  out: ['我又爬回来了……', '打不走的，我是你的人', '你手疼不疼？', '我错了我错了', '再来一拳也行，别不理我'],
  punish: ['啊！我错了！', '轻点轻点……', '这下记住了！', '嗷——活该我', '打完能原谅我吗？', '我再也不敢了！'],
};
const MODES = {
  pat: { pose: 'kneel', btn: '摸摸头', cls: 'forgive', hint: '点按钮或点小人，摸摸他的头', unit: '已摸头' },
  out: { pose: 'stand', btn: '一拳打飞', cls: 'out', hint: '点按钮或点小人，一拳把他打飞', unit: '已打飞' },
  punish: { pose: 'hang', btn: '抽一鞭子', cls: 'punish', hint: '点按钮或点小人，狠狠抽他', unit: '已抽' },
};
const state = { mode: 'home', counts: { pat: 0, out: 0, punish: 0 }, busy: false, sound: true };

/* ---------- sound ---------- */
let ac = null;
function audio() {
  if (!state.sound) return null;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
function tone(f1, f2, dur, type = 'sine', gain = .25) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, filterType, freq, gain = .4) {
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = filterType; f.frequency.value = freq; g.gain.value = gain;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const sfx = {
  pat: () => tone(520, 880, .12, 'triangle', .18),
  thud: () => { tone(180, 45, .3, 'sine', .5); noise(.15, 'lowpass', 900, .5); },
  slap: () => noise(.14, 'highpass', 1800, .7),
  whoosh: () => noise(.25, 'bandpass', 700, .25),
  boing: () => tone(260, 720, .28, 'square', .06),
};
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ---------- helpers ---------- */
const D = ms => reduce ? Math.round(ms * .5) : ms;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function setFace(f) { svg.dataset.face = f; }
function setPose(p) { svg.dataset.pose = p; stage.dataset.pose = p; }
let bubbleTimer;
function say(text, ms = 2600) {
  bubble.textContent = text; bubble.classList.remove('hide');
  clearTimeout(bubbleTimer);
  if (ms) bubbleTimer = setTimeout(() => bubble.classList.add('hide'), ms);
}
function geo() {
  const s = stage.getBoundingClientRect(), b = svg.getBoundingClientRect();
  const sx = b.width / 240, sy = b.height / 300;
  return { cx: b.left - s.left + 120 * sx, headTop: b.top - s.top + 30 * sy, face: b.top - s.top + 105 * sy, body: b.top - s.top + 190 * sy, scale: sx, left: b.left - s.left, right: b.right - s.left };
}
function fx(text, x, y) {
  const el = document.createElement('div'); el.className = 'fx'; el.textContent = text;
  el.style.left = x + 'px'; el.style.top = y + 'px'; stage.appendChild(el);
  el.animate([{ transform: 'translate(-50%,-50%) scale(.3) rotate(-12deg)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(1.15) rotate(6deg)', opacity: 1, offset: .35 }, { transform: 'translate(-50%,-90%) scale(1)', opacity: 0 }], { duration: D(800), easing: 'ease-out' }).finished.then(() => el.remove());
}
function hearts(n) {
  const g = geo();
  for (let i = 0; i < n; i++) {
    const h = document.createElement('div'); h.className = 'heart'; h.textContent = '♥';
    h.style.left = (g.cx + (Math.random() - .5) * 160) + 'px'; h.style.top = (g.face + Math.random() * 40) + 'px';
    h.style.fontSize = (16 + Math.random() * 18) + 'px'; stage.appendChild(h);
    h.animate([{ transform: 'translateY(0) scale(.4)', opacity: 0 }, { opacity: 1, offset: .2 }, { transform: `translate(${(Math.random() - .5) * 60}px,-140px) scale(1)`, opacity: 0 }], { duration: D(1400 + Math.random() * 600), delay: i * 90, easing: 'ease-out', fill: 'backwards' }).finished.then(() => h.remove());
  }
}
function updateCounter() {
  const c = $('#counter');
  if (state.mode === 'home') { c.hidden = true; return; }
  const n = state.counts[state.mode];
  c.hidden = false; c.textContent = MODES[state.mode].unit + ' ' + n + ' 次';
}
function addWelt() {
  const w = $('#welts');
  if (w.childNodes.length > 14) w.firstChild.remove();
  const x = 86 + Math.random() * 62, y = 160 + Math.random() * 60, r = -35 + Math.random() * 70;
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  p.setAttribute('x1', x); p.setAttribute('y1', y); p.setAttribute('x2', x + 20); p.setAttribute('y2', y);
  p.setAttribute('stroke', '#F0646E'); p.setAttribute('stroke-width', '3.5'); p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('transform', `rotate(${r} ${x + 10} ${y})`); p.setAttribute('opacity', '.85');
  w.appendChild(p);
}

/* ---------- modes ---------- */
function enterMode(m) {
  state.mode = m; state.busy = false;
  $('#done').hidden = true;
  $('#welts').innerHTML = '';
  rig.getAnimations().forEach(a => a.cancel()); boy.getAnimations().forEach(a => a.cancel());
  const home = m === 'home';
  $('#homeControls').hidden = !home; $('#actionControls').hidden = home;
  if (home) {
    setPose('kneel'); setFace('sad'); say(pick(LINES.home), 0);
  } else {
    const M = MODES[m];
    setPose(M.pose); setFace('sad');
    const btn = $('#actionBtn'); btn.textContent = M.btn; btn.className = 'btn big ' + M.cls;
    $('#actionHint').textContent = M.hint;
    say(m === 'pat' ? '你……愿意原谅我？' : m === 'out' ? '别赶我走嘛……' : '我认罚，来吧！', 0);
  }
  $('#backBtn').classList.remove('pulse'); $('#choosePat').classList.remove('pulse');
  updateCounter();
}

async function doPat() {
  state.busy = true;
  const n = ++state.counts.pat; updateCounter();
  const g = geo(), hand = $('#hand'), w = 86;
  hand.style.left = (g.cx - w / 2) + 'px'; hand.style.top = (g.headTop - w * .62) + 'px';
  const pats = [];
  for (let i = 0; i < 3; i++) pats.push({ transform: 'translate(-10px,6px) rotate(-6deg)', opacity: 1 }, { transform: 'translate(10px,12px) rotate(6deg)', opacity: 1 });
  const anim = hand.animate([{ transform: 'translateY(-90px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1, offset: .2 }, ...pats, { transform: 'translateY(-70px)', opacity: 0 }], { duration: D(1300), easing: 'ease-in-out' });
  setTimeout(() => { sfx.pat(); setFace(n >= 3 ? 'happy' : 'shy'); }, D(280));
  setTimeout(sfx.pat, D(560)); setTimeout(sfx.pat, D(840));
  boy.animate([{ transform: 'translateX(-50%) scale(1,1)' }, { transform: 'translateX(-50%) scale(1.03,.96)' }, { transform: 'translateX(-50%) scale(1,1)' }], { duration: D(280), iterations: 3, delay: D(260) });
  if (n >= 3) hearts(4 + Math.min(n, 6));
  say(LINES.pat[Math.min(n - 1, LINES.pat.length - 1)]);
  await anim.finished;
  state.busy = false;
  if (n === 5) { await sleep(200); hearts(12); $('#done').hidden = false; sfx.boing(); }
}

async function doOut() {
  state.busy = true;
  const g = geo(), glove = $('#glove'), w = 110;
  glove.style.left = (-w) + 'px'; glove.style.top = (g.face - w * .4) + 'px';
  const dx = g.cx - 40 * g.scale;
  sfx.whoosh();
  const ga = glove.animate([{ transform: 'translateX(0)', opacity: 1 }, { transform: `translateX(${dx}px)`, opacity: 1, offset: .45 }, { transform: `translateX(${dx - 25}px)`, opacity: 1, offset: .65 }, { transform: 'translateX(0)', opacity: 0 }], { duration: D(650), easing: 'ease-in-out' });
  await sleep(D(290));
  const n = ++state.counts.out; updateCounter();
  sfx.thud(); buzz(60); setFace('hurt'); fx('砰！', g.cx, g.face - 20); bubble.classList.add('hide');
  const fly = boy.animate([{ transform: 'translateX(-50%) rotate(0)', opacity: 1 }, { transform: 'translate(140%,-120%) rotate(620deg) scale(.4)', opacity: 0 }], { duration: D(750), easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' });
  await fly.finished; await ga.finished.catch(() => {});
  await sleep(D(450));
  fly.cancel(); setFace('sad'); sfx.boing();
  const back = boy.animate([{ transform: 'translateX(140%)' }, { transform: 'translateX(60%) translateY(-6px)' }, { transform: 'translateX(-10%)' }, { transform: 'translateX(-50%) translateY(-6px)' }, { transform: 'translateX(-50%)' }], { duration: D(900), easing: 'ease-out' });
  await back.finished;
  say(LINES.out[(n - 1) % LINES.out.length]);
  state.busy = false;
  if (n >= 5) $('#backBtn').classList.add('pulse');
}

async function doPunish() {
  state.busy = true;
  const g = geo(), whip = $('#whip'), w = 150;
  whip.style.left = (g.right - w * .35) + 'px'; whip.style.top = (g.body - w * .95) + 'px';
  sfx.whoosh();
  const wa = whip.animate([{ transform: 'rotate(55deg)', opacity: 0 }, { transform: 'rotate(40deg)', opacity: 1, offset: .25 }, { transform: 'rotate(-18deg)', opacity: 1, offset: .5 }, { transform: 'rotate(-10deg)', opacity: 1, offset: .7 }, { transform: 'rotate(30deg)', opacity: 0 }], { duration: D(560), easing: 'ease-in' });
  await sleep(D(270));
  const n = ++state.counts.punish; updateCounter();
  sfx.slap(); buzz(40); setFace('hurt'); addWelt(); fx('啪！', g.cx - 30 * g.scale, g.body - 20);
  rig.getAnimations().forEach(a => a.cancel());
  rig.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-7deg)' }, { transform: 'rotate(5deg)' }, { transform: 'rotate(-3deg)' }, { transform: 'rotate(1.5deg)' }, { transform: 'rotate(0)' }], { duration: D(1300), easing: 'ease-out' });
  say(pick(LINES.punish), 1800);
  setTimeout(() => { if (state.mode === 'punish' && !state.busy) setFace('sad'); }, D(900));
  await sleep(D(250));
  state.busy = false;
  await wa.finished.catch(() => {});
  if (n === 10) { say('气消一点了吗？要不去摸摸头？', 3500); $('#backBtn').classList.add('pulse'); }
}

function act() {
  if (state.busy || state.mode === 'home') return;
  if (!$('#done').hidden) return;
  ({ pat: doPat, out: doOut, punish: doPunish })[state.mode]();
}

document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { audio(); enterMode(b.dataset.mode); }));
$('#actionBtn').addEventListener('click', act);
boy.addEventListener('click', () => { if (state.mode === 'home') { say(pick(LINES.home)); sfx.pat(); } else act(); });
$('#backBtn').addEventListener('click', () => enterMode('home'));
$('#homeBtn2').addEventListener('click', () => enterMode('home'));
$('#againBtn').addEventListener('click', () => { $('#done').hidden = true; });
$('#soundBtn').addEventListener('click', e => {
  state.sound = !state.sound; e.currentTarget.textContent = '音效：' + (state.sound ? '开' : '关');
  e.currentTarget.setAttribute('aria-pressed', state.sound);
});

/* ---------- background music ---------- */
const bgm = $('#bgm'), musicBtn = $('#musicBtn');
let musicWanted = true;
function showMusic() {
  const on = !bgm.paused;
  musicBtn.textContent = '♪ 音乐：' + (on ? '开' : '关');
  musicBtn.classList.toggle('on', on); musicBtn.setAttribute('aria-pressed', on);
}
function playMusic() {
  if (!musicWanted || !bgm.paused) return;
  try { const p = bgm.play(); if (p) p.then(showMusic).catch(showMusic); } catch (e) {}
}
bgm.volume = .85;
bgm.addEventListener('play', showMusic); bgm.addEventListener('pause', showMusic);
musicBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (bgm.paused) { musicWanted = true; playMusic(); } else { musicWanted = false; bgm.pause(); }
});
// 浏览器不允许自动出声：第一次点屏幕任意位置时开始播放
['pointerdown', 'touchstart', 'click'].forEach(t => document.addEventListener(t, playMusic, { passive: true }));
document.addEventListener('WeixinJSBridgeReady', playMusic);
playMusic();

enterMode('home');
</script>
